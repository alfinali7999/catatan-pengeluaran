<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manajemen Catatan Pengeluaran</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f172a;
      --wa: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px 40px;
      line-height: 1.5;
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .stat-label { font-size: 0.8rem; color: var(--muted); }
    .stat-val { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }
    .row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    button {
      flex: 1;
      min-width: 140px;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-ghost { background: #e2e8f0; color: var(--text); flex: 0 0 auto; }
    .alert {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-top: 10px;
      display: none;
    }
    .alert.info { display: block; background: #eff6ff; color: #1e40af; }
    .alert.warn { display: block; background: #fef3c7; color: #92400e; }
    .alert.danger { display: block; background: #fee2e2; color: #991b1b; }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      gap: 12px;
    }
    .item:last-child { border-bottom: none; }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #334155;
      margin-right: 6px;
    }
    .muted { color: var(--muted); font-size: 0.82rem; }
  </style>
</head>
<body>
  <h1>Catatan Pengeluaran Harian</h1>
  <div class="sub">Kirim pesan WA (contoh: <strong>3rb bayar parkir</strong>) atau input langsung dari web</div>

  <div class="grid">
    <div class="card" style="margin-bottom:0;">
      <div class="stat-label">Pengeluaran Hari Ini</div>
      <div class="stat-val" id="todayTotal">Rp 0</div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="stat-label">Pengeluaran Bulan Ini</div>
      <div class="stat-val" id="monthTotal">Rp 0</div>
    </div>
    <div class="card" style="margin-bottom:0;">
      <div class="stat-label">Batas Harian</div>
      <div class="stat-val" id="limitDisplay">Rp 150.000</div>
    </div>
  </div>

  <div class="card">
    <label for="quickInput">Input Manual dari Web</label>
    <input id="quickInput" type="text" placeholder="Contoh: 3rb bayar parkir" autocomplete="off" />
    <div class="row">
      <button class="btn-primary" id="saveBtn">Simpan ke Google Sheets</button>
      <button class="btn-ghost" id="syncBtn">Sinkron dari Sheets</button>
    </div>
    <div id="statusBox" class="alert"></div>
  </div>

  <div class="card">
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
      <div style="flex:1; min-width:180px;">
        <label for="dailyLimitInput">Atur Batas Pengeluaran Harian (Rp)</label>
        <input id="dailyLimitInput" type="number" min="0" step="5000" value="150000" />
      </div>
      <div style="flex:1; min-width:180px;">
        <label for="filterCategory">Filter Kategori</label>
        <select id="filterCategory">
          <option value="ALL">Semua Kategori</option>
          <option value="Transportasi">Transportasi</option>
          <option value="Konsumsi">Konsumsi</option>
          <option value="Utilitas">Utilitas</option>
          <option value="Umum">Umum</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <strong>Riwayat Pengeluaran</strong>
    <div id="historyList" style="margin-top:8px;"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVMMwsDvgshKRUOch4e2UVS2aXkQgn9kktL4_eK5h33KJvyH4BBlGD0cet8sxJ6e5a/exec";
    const STORAGE_KEY = "fin_expense_items_v1";
    const LIMIT_KEY = "fin_expense_daily_limit_v1";

    function formatRp(n) {
      return "Rp " + Number(n || 0).toLocaleString("id-ID");
    }

    function parseExpense(raw) {
      const text = (raw || "").trim();
      const match = text.match(/^([\d.,]+)\s*(rb|ribu|k|jt|juta)?\s+(.+)$/i);
      if (!match) return null;

      let nominal = parseFloat(match[1].replace(/\./g, "").replace(",", "."));
      if (isNaN(nominal)) return null;

      const unit = (match[2] || "").toLowerCase();
      if (unit === "rb" || unit === "ribu" || unit === "k") nominal *= 1000;
      if (unit === "jt" || unit === "juta") nominal *= 1000000;

      const keterangan = match[3].trim();
      let kategori = "Umum";
      if (/parkir|bensin|bbm|tol|ojol|grab|maxim|indrive|service|ban|oli/i.test(keterangan)) {
        kategori = "Transportasi";
      } else if (/makan|kopi|minum|snack|warteg|resto|sarapan|siang|malam/i.test(keterangan)) {
        kategori = "Konsumsi";
      } else if (/pulsa|kuota|internet|listrik|air|token/i.test(keterangan)) {
        kategori = "Utilitas";
      }

      return {
        tanggal: new Date().toISOString().slice(0, 10),
        nominal: Math.round(nominal),
        kategori,
        keterangan,
        sumber: "Web HTML5"
      };
    }

    function getItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function setItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function showStatus(msg, type = "info") {
      const box = document.getElementById("statusBox");
      box.className = "alert " + type;
      box.textContent = msg;
    }

    function checkBudgetAlert(items) {
      const today = new Date().toISOString().slice(0, 10);
      const limit = Number(localStorage.getItem(LIMIT_KEY) || 150000);
      const todaySum = items
        .filter(i => i.tanggal === today)
        .reduce((acc, i) => acc + Number(i.nominal || 0), 0);

      if (limit > 0 && todaySum >= limit) {
        showStatus(`Peringatan: Pengeluaran hari ini (${formatRp(todaySum)}) mencapai/melewati batas harian (${formatRp(limit)}).`, "danger");
      } else if (limit > 0 && todaySum >= limit * 0.8) {
        showStatus(`Perhatian: Pengeluaran hari ini (${formatRp(todaySum)}) sudah di atas 80% batas harian (${formatRp(limit)}).`, "warn");
      }
    }

    function render() {
      const items = getItems();
      const filterCat = document.getElementById("filterCategory").value;
      const limit = Number(localStorage.getItem(LIMIT_KEY) || 150000);
      const today = new Date().toISOString().slice(0, 10);
      const thisMonth = today.slice(0, 7);

      const todaySum = items.filter(i => i.tanggal === today).reduce((a, b) => a + Number(b.nominal || 0), 0);
      const monthSum = items.filter(i => String(i.tanggal).startsWith(thisMonth)).reduce((a, b) => a + Number(b.nominal || 0), 0);

      document.getElementById("todayTotal").textContent = formatRp(todaySum);
      document.getElementById("monthTotal").textContent = formatRp(monthSum);
      document.getElementById("limitDisplay").textContent = formatRp(limit);

      const filtered = filterCat === "ALL" ? items : items.filter(i => i.kategori === filterCat);
      const listEl = document.getElementById("historyList");

      if (!filtered.length) {
        listEl.innerHTML = '<div class="muted">Belum ada catatan pengeluaran.</div>';
        return;
      }

      listEl.innerHTML = filtered.map(item => `
        <div class="item">
          <div>
            <div><span class="badge">${item.kategori}</span><strong>${item.keterangan}</strong></div>
            <div class="muted">${item.tanggal} • ${item.sumber || "Web HTML5"}</div>
          </div>
          <div><strong>${formatRp(item.nominal)}</strong></div>
        </div>
      `).join("");
    }

    async function sendToSheets(entry) {
      if (!APPS_SCRIPT_URL.startsWith("https://")) {
        showStatus("Tersimpan di browser (localStorage). Isi APPS_SCRIPT_URL agar masuk ke Google Sheets.", "warn");
        return;
      }
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(entry)
        });
        showStatus(`Tercatat: ${entry.keterangan} (${formatRp(entry.nominal)}) -> Terkirim ke Google Sheets.`, "info");
      } catch {
        showStatus("Gagal kirim ke Google Sheets, data tetap aman di browser.", "warn");
      }
    }

    async function syncFromSheets() {
      if (!APPS_SCRIPT_URL.startsWith("https://")) return;
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        if (data.status === "ok" && Array.isArray(data.items)) {
          setItems(data.items);
          render();
          checkBudgetAlert(data.items);
          showStatus("Data berhasil disinkronkan dari Google Spreadsheet.", "info");
        }
      } catch {
        // Tetap pakai data lokal jika gagal fetch
      }
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const input = document.getElementById("quickInput");
      const parsed = parseExpense(input.value);
      if (!parsed) {
        showStatus("Format belum dikenali. Gunakan format seperti: 3rb bayar parkir", "warn");
        return;
      }
      const items = getItems();
      items.unshift(parsed);
      setItems(items);
      render();
      checkBudgetAlert(items);
      input.value = "";
      await sendToSheets(parsed);
    });

    document.getElementById("syncBtn").addEventListener("click", syncFromSheets);

    document.getElementById("dailyLimitInput").addEventListener("change", (e) => {
      const val = Math.max(0, Number(e.target.value || 0));
      localStorage.setItem(LIMIT_KEY, String(val));
      render();
      checkBudgetAlert(getItems());
    });

    document.getElementById("filterCategory").addEventListener("change", render);

    const savedLimit = localStorage.getItem(LIMIT_KEY);
    if (savedLimit) document.getElementById("dailyLimitInput").value = savedLimit;
    render();
    checkBudgetAlert(getItems());
    syncFromSheets();
  </script>
</body>
</html>
